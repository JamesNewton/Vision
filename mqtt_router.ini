# Global MQTT broker settings
[broker]
host = localhost
port = 1883

[doorbell]
in_topic = camera/FrontDoor/person
cooldown = 5
out      = alert/DoorBell

[radiation]
in_topic     = sensors/radiation/cpm
op           = outside_range
min          = 1
max          = 70
#edge_trigger = true
cooldown     = 600
out          = alert/alert
out          = alert/TTS | "radiation"

